<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 270" role="img" aria-labelledby="relay-t relay-d">
  <title id="relay-t">The token stays on the relay</title>
  <desc id="relay-d">The page sends a report to the relay without any token. The relay checks the origin and the repo, removes known secrets again, and creates the issue on GitHub with the token that only it holds. The relay sits behind your login proxy.</desc>
  <style data-standalone="">
    /* Only for a look outside t7d.dev (GitHub, an editor). The site drops this block and draws the same classes with its own styles. */
    .paper { fill: #fff; }
    text { font: 500 13px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #111; letter-spacing: .02em; }
    .t-s { font-size: 11px; fill: #5c5c5c; }
    .t-h { font: 600 15px/1 "Barlow Condensed", "Arial Narrow", sans-serif; letter-spacing: .03em; text-transform: uppercase; }
    .t-m { fill: #5c5c5c; }
    .t-inv { fill: #fff; }
    .ln { fill: none; stroke: #111; stroke-width: 1.5; }
    .ln-s { fill: none; stroke: #5c5c5c; stroke-width: 1; stroke-dasharray: 4 4; }
    .bx { fill: #fff; stroke: #111; stroke-width: 1.5; }
    .bx-s { fill: #f4f4f2; stroke: #111; stroke-width: 1; }
    .bx-i { fill: #111; stroke: #111; stroke-width: 1.5; }
    .bx-d { fill: none; stroke: #111; stroke-width: 1; stroke-dasharray: 5 4; }
    .arr { fill: #111; }
    @media (prefers-color-scheme: dark) {
      .paper { fill: #0e0e0e; }
      text { fill: #f2f2f2; }
      .t-s, .t-m { fill: #a3a3a3; }
      .t-inv { fill: #0e0e0e; }
      .ln, .bx-d { stroke: #f2f2f2; }
      .ln-s { stroke: #a3a3a3; }
      .bx { fill: #0e0e0e; stroke: #f2f2f2; }
      .bx-s { fill: #1a1a1a; stroke: #f2f2f2; }
      .bx-i { fill: #f2f2f2; stroke: #f2f2f2; }
      .arr { fill: #f2f2f2; }
    }
  </style>
  <rect class="paper" data-standalone="" width="680" height="270"/>
  <rect class="bx" x="20" y="80" width="140" height="90"/>
  <text x="90.0" y="122.0" class="t-h" text-anchor="middle">Page</text>
  <text x="90.0" y="140.0" class="t-s" text-anchor="middle">with the widget</text>
  <text x="90" y="192" class="t-s" text-anchor="middle">removes known</text>
  <text x="90" y="208" class="t-s" text-anchor="middle">secrets, has no token</text>
  <rect class="bx-d" x="265" y="30" width="220" height="220"/>
  <text x="375" y="22" class="t-s" text-anchor="middle">behind your login proxy</text>
  <rect class="bx" x="280" y="50" width="190" height="180"/>
  <text x="375" y="78" class="t-h" text-anchor="middle">Relay</text>
  <text x="294" y="108">origin allowed?</text>
  <text x="294" y="132">repo allowed?</text>
  <text x="294" y="156">secrets removed again</text>
  <rect class="bx-i" x="294" y="182" width="162" height="30"/>
  <text x="375" y="202" class="t-inv" text-anchor="middle">token</text>
  <polyline class="ln" points="160,125 272.0,125.0"/>
  <polygon class="arr" points="280,125 272.0,130.0 272.0,120.0"/>
  <text x="212" y="100" class="t-s" text-anchor="middle">POST /report</text>
  <text x="212" y="116" class="t-s" text-anchor="middle">no token</text>
  <rect class="bx" x="570" y="80" width="90" height="90"/>
  <text x="615.0" y="122.0" class="t-h" text-anchor="middle">GitHub</text>
  <text x="615.0" y="140.0" class="t-s" text-anchor="middle">issue #12</text>
  <polyline class="ln" points="470,125 562.0,125.0"/>
  <polygon class="arr" points="570,125 562.0,130.0 562.0,120.0"/>
  <text x="528" y="100" class="t-s" text-anchor="middle">with the</text>
  <text x="528" y="116" class="t-s" text-anchor="middle">token</text>
</svg>
