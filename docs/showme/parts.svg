<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-labelledby="parts-t parts-d">
  <title id="parts-t">Three ways in, one place</title>
  <desc id="parts-d">A person uses the widget on a page, an agent in a browser calls the JS API, and both go through the relay. An agent in a terminal uses the CLI. All three write to the same store: GitHub issues, or a local file of the repo.</desc>
  <style data-standalone="">
    /* Only for a look outside t7d.dev (GitHub, an editor). The site drops this block and draws the same classes with its own styles. */
    .paper { fill: #fff; }
    text { font: 500 13px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #111; letter-spacing: .02em; }
    .t-s { font-size: 11px; fill: #5c5c5c; }
    .t-h { font: 600 15px/1 "Barlow Condensed", "Arial Narrow", sans-serif; letter-spacing: .03em; text-transform: uppercase; }
    .t-m { fill: #5c5c5c; }
    .t-inv { fill: #fff; }
    .ln { fill: none; stroke: #111; stroke-width: 1.5; }
    .ln-s { fill: none; stroke: #5c5c5c; stroke-width: 1; stroke-dasharray: 4 4; }
    .bx { fill: #fff; stroke: #111; stroke-width: 1.5; }
    .bx-s { fill: #f4f4f2; stroke: #111; stroke-width: 1; }
    .bx-i { fill: #111; stroke: #111; stroke-width: 1.5; }
    .bx-d { fill: none; stroke: #111; stroke-width: 1; stroke-dasharray: 5 4; }
    .arr { fill: #111; }
    @media (prefers-color-scheme: dark) {
      .paper { fill: #0e0e0e; }
      text { fill: #f2f2f2; }
      .t-s, .t-m { fill: #a3a3a3; }
      .t-inv { fill: #0e0e0e; }
      .ln, .bx-d { stroke: #f2f2f2; }
      .ln-s { stroke: #a3a3a3; }
      .bx { fill: #0e0e0e; stroke: #f2f2f2; }
      .bx-s { fill: #1a1a1a; stroke: #f2f2f2; }
      .bx-i { fill: #f2f2f2; stroke: #f2f2f2; }
      .arr { fill: #f2f2f2; }
    }
  </style>
  <rect class="paper" data-standalone="" width="680" height="300"/>
  <rect class="bx" x="20" y="30" width="190" height="60"/>
  <text x="115.0" y="57.0" class="t-h" text-anchor="middle">Widget</text>
  <text x="115.0" y="75.0" class="t-s" text-anchor="middle">a person, on the page</text>
  <rect class="bx" x="20" y="120" width="190" height="60"/>
  <text x="115.0" y="147.0" class="t-h" text-anchor="middle">JS API</text>
  <text x="115.0" y="165.0" class="t-s" text-anchor="middle">an agent in a browser</text>
  <rect class="bx" x="20" y="210" width="190" height="60"/>
  <text x="115.0" y="237.0" class="t-h" text-anchor="middle">CLI</text>
  <text x="115.0" y="255.0" class="t-s" text-anchor="middle">an agent in a terminal</text>
  <rect class="bx-i" x="270" y="60" width="150" height="90"/>
  <text x="345.0" y="102.0" class="t-h t-inv" text-anchor="middle">Relay</text>
  <text x="345.0" y="120.0" class="t-s t-inv" text-anchor="middle">holds the credential</text>
  <polyline class="ln" points="210,60 240,60 240,90 262.0,90.0"/>
  <polygon class="arr" points="270,90 262.0,95.0 262.0,85.0"/>
  <polyline class="ln" points="210,150 240,150 240,120 262.0,120.0"/>
  <polygon class="arr" points="270,120 262.0,125.0 262.0,115.0"/>
  <rect class="bx-d" x="470" y="20" width="200" height="260"/>
  <text x="570" y="44" class="t-s" text-anchor="middle">one place</text>
  <rect class="bx" x="480" y="58" width="180" height="70"/>
  <text x="570.0" y="90.0" class="t-h" text-anchor="middle">GitHub issues</text>
  <text x="570.0" y="108.0" class="t-s" text-anchor="middle">label papercut</text>
  <text x="570" y="152" class="t-s" text-anchor="middle">or</text>
  <rect class="bx" x="480" y="168" width="180" height="70"/>
  <text x="570.0" y="200.0" class="t-h" text-anchor="middle">Local file</text>
  <text x="570.0" y="218.0" class="t-s" text-anchor="middle">.papercuts/papercuts.db</text>
  <text x="570" y="264" class="t-s" text-anchor="middle">the same format</text>
  <polyline class="ln" points="420,105 462.0,105.0"/>
  <polygon class="arr" points="470,105 462.0,110.0 462.0,100.0"/>
  <polyline class="ln" points="210,240 462.0,240.0"/>
  <polygon class="arr" points="470,240 462.0,245.0 462.0,235.0"/>
  <text x="340" y="232" class="t-s" text-anchor="middle">gh login of the host</text>
</svg>
