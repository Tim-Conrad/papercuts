# The relay in a home lab behind Traefik and Authelia. Copy this file to docker-compose.yml and change the host names.
# Put a fine-grained token (permission "Issues: read and write" only) into ./secrets/github-token. Keep it out of git.
services:
  papercuts:
    build: .
    restart: unless-stopped
    mem_limit: 128m
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
    networks: [proxy]
    environment:
      PAPERCUTS_ORIGINS: "https://*.lab.t7d.dev"
      PAPERCUTS_REPOS: "Tim-Conrad/*"
      PAPERCUTS_TARGET: "per-project"
      PAPERCUTS_TOKEN_FILE: /run/secrets/github-token
    secrets: [github-token]
    labels:
      - traefik.enable=true
      - traefik.http.routers.papercuts.rule=Host(`papercuts.lab.t7d.dev`)
      - traefik.http.routers.papercuts.entrypoints=websecure
      - traefik.http.routers.papercuts.tls=true
      - traefik.http.routers.papercuts.middlewares=authelia@file,security-headers@file
      - traefik.http.services.papercuts.loadbalancer.server.port=8000
      - homepage.group=Tools
      - homepage.name=Papercuts
      - homepage.href=https://papercuts.lab.t7d.dev/status
secrets:
  github-token:
    file: ./secrets/github-token
networks:
  proxy:
    external: true
