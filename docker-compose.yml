# The relay in a home lab behind Traefik and Authelia (the stack of papercuts.lab.t7d.dev).
# For your own lab, change the host names, the origins, the repos and the uid.
#
# Credential: the gh login of the host user, mounted read-only. The container runs as that user,
# because gh keeps hosts.yml with mode 600. For a narrow token, set PAPERCUTS_CREDENTIAL=file and
# PAPERCUTS_TOKEN_FILE to a fine-grained token (see README).
#
# This lab reaches GitHub only through a credential gateway (gh.gate on the lab-only network): the
# gh login holds a dummy token, the gateway adds a short-lived GitHub App token (Issues write, the
# lab repos only). Without a gateway, drop PAPERCUTS_GITHUB_HOST, NODE_EXTRA_CA_CERTS, the CA mount
# and extra_hosts. GitHub refuses picture uploads from App tokens, so the relay keeps pictures in
# the shots volume and links them.
services:
  papercuts:
    build: .
    restart: unless-stopped
    user: "${PAPERCUTS_UID:-1001}:${PAPERCUTS_GID:-1001}"
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m   # one report with an 8 MB picture needs about 55 MB while it is parsed
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
    networks: [proxy]
    environment:
      PAPERCUTS_ORIGINS: "https://*.lab.t7d.dev"
      PAPERCUTS_REPOS: "Tim-Conrad/*"
      PAPERCUTS_TARGET: "per-project"
      PAPERCUTS_CREDENTIAL: gh
      PAPERCUTS_GH_MOUNT: /gh
      PAPERCUTS_PUBLIC_URL: "https://papercuts.lab.t7d.dev"
      PAPERCUTS_GITHUB_HOST: gh.gate
      NODE_EXTRA_CA_CERTS: /gate-ca.crt
    extra_hosts: ["gh.gate:192.168.101.20"]
    volumes:
      - ${HOME}/.config/gh:/gh:ro
      - /etc/gate/ca.crt:/gate-ca.crt:ro
      - shots:/data/shots
    labels:
      - traefik.enable=true
      - traefik.http.routers.papercuts.rule=Host(`papercuts.lab.t7d.dev`)
      - traefik.http.routers.papercuts.entrypoints=websecure
      - traefik.http.routers.papercuts.tls=true
      - traefik.http.routers.papercuts.middlewares=authelia@file,security-headers@file
      - traefik.http.services.papercuts.loadbalancer.server.port=8000
      - homepage.group=Tools
      - homepage.name=Papercuts
      - homepage.href=https://papercuts.lab.t7d.dev/status
      - homepage.description=Feedback from people and agents, as GitHub issues
volumes:
  shots:
networks:
  proxy:
    external: true
