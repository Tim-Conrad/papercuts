<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Papercuts test page</title>
<script src="RELAY/papercuts.js" data-repo="Tim-Conrad/shop" data-commit="abc1234" data-branch="main" data-storage="theme"></script>
<style>
  * { color: red !important; font-family: serif !important; }
  body { margin: 0; padding: 16px; }
  .card { border: 1px solid #999; padding: 16px; margin: 16px 0; }
</style>
</head>
<body>
<h1>Shop</h1>
<div class="card" data-product="42"><h2 id="title">Blue mug</h2><button id="buy">Buy</button></div>
<p id="long">Some text to select.</p>
<button id="open-dlg" type="button">Open dialog</button>
<dialog id="dlg"><p id="dlg-text">A modal dialog</p><button id="close-dlg" type="button">Close dialog</button></dialog>
<div id="tall" style="height: 2400px"><p id="far" style="margin-top: 1800px">Far down</p></div>
<script>
  document.getElementById('open-dlg').onclick = () => document.getElementById('dlg').showModal();
  document.getElementById('close-dlg').onclick = () => document.getElementById('dlg').close();
  // Light dismiss, as many apps do it: a click on the backdrop closes the dialog.
  document.getElementById('dlg').addEventListener('click', (e) => { if (e.target.id === 'dlg') e.target.close(); });
</script>
</body>
</html>
